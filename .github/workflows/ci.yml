name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `frida` downloads its native prebuild from GitHub releases in its
      # install script (prebuild-install), so install scripts must run.
      # --foreground-scripts streams that output into the job log.
      - run: npm ci --foreground-scripts

      - run: npm run build

      - run: npm run lint

      # Run the suite with the coverage gate on every combo; v8 overhead is small and the
      # gate then protects all platforms/Node versions (no fragile single-combo condition).
      - run: npm run test:coverage

      - name: Smoke test CLI entrypoint
        run: node dist/index.js --help

      - name: Verify package contents
        run: npm pack --dry-run --json | node .github/scripts/check-pack-contents.mjs
