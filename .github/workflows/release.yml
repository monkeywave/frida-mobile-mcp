name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # Prefer a GitHub App token / fine-grained PAT (secret RELEASE_PLEASE_TOKEN) so the
          # release PR is opened under an identity whose events trigger CI; fall back to the
          # default GITHUB_TOKEN when the secret is absent.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: .release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs in the same workflow as release-please because tags created with
  # GITHUB_TOKEN do not trigger other workflows (so an `on: push: tags` publish
  # workflow would never fire). Authenticates to npm via OIDC trusted publishing
  # (no NPM_TOKEN secret); configure the trusted publisher for this repo and
  # workflow file in the npm package settings.
  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write      # npm trusted publishing (OIDC) + MCP registry GitHub OIDC login
      contents: write      # upload the .mcpb bundle as a GitHub release asset
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm

      # npm trusted publishing (OIDC) requires npm >= 11.5.1.
      - run: npm install -g npm@latest

      - run: npm --version

      - run: npm ci --foreground-scripts

      - run: npm run build

      - run: npm test

      - run: npm publish --provenance --access public

      # Build the MCPB bundle (.mcpb) from manifest.json and attach it to the GitHub release
      # so it can be installed in one click by MCPB-aware clients.
      - name: Build MCPB bundle
        run: npx --yes @anthropic-ai/mcpb pack . frida-mobile-mcp.mcpb

      - name: Attach MCPB bundle to the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" frida-mobile-mcp.mcpb --clobber

  # Register server.json with the official MCP registry. This is a SEPARATE job from
  # `publish` (not just another step) so that a propagation-race failure is re-runnable
  # on its own with `gh run rerun --failed`: re-running never re-triggers `npm publish`
  # (which would 403 on the already-published version). It only starts once `publish`
  # has succeeded, so npm definitely has the release by the time we poll for it.
  mcp-registry:
    name: Publish to the MCP registry
    needs: [release-please, publish]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      id-token: write      # MCP registry GitHub OIDC login
      contents: read       # checkout server.json at the release tag
    env:
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # OIDC from this repo grants the io.github.monkeywave/* namespace.
      # The ubuntu-latest runner is linux/amd64; mcp-publisher is pinned for reproducibility.
      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher.tar.gz
          tar -xzf mcp-publisher.tar.gz mcp-publisher

      - name: Validate server.json
        run: ./mcp-publisher validate

      # The MCP registry rejects registration until npm's public read replica can see the
      # version we just published (it 404s against registry.npmjs.org otherwise). That read
      # side can lag the publish by many minutes, so wait — polling both the per-version
      # document (what the registry validates against) and the packument/dist-tags (so we
      # don't register against a half-propagated view) — before registering.
      - name: Wait for npm to serve the release
        run: |
          VERSION="${TAG_NAME#v}"
          PKG="frida-mobile-mcp"
          echo "Waiting for npm to serve ${PKG}@${VERSION}..."
          for i in $(seq 1 60); do
            if curl -fsS "https://registry.npmjs.org/${PKG}/${VERSION}" >/dev/null 2>&1 \
               && curl -fsS "https://registry.npmjs.org/${PKG}" 2>/dev/null | grep -q "\"${VERSION}\""; then
              echo "npm is serving ${VERSION}; registering with the MCP registry"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "npm did not serve ${VERSION} within ~15 min; aborting." >&2
              echo "npm has the release but its read replica is slow: just re-run this job" >&2
              echo "(gh run rerun --failed) — it will not re-publish to npm." >&2
              exit 1
            fi
            echo "  not visible yet ($i/60); retrying in 15s"
            sleep 15
          done

      - name: Register with the MCP registry
        run: |
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
